<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Register</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #f7f7f7;

      font-family: Arial, Helvetica, sans-serif;
    }

    /* 注册卡片 */
    .register-card {
      width: 800px;
      min-height: 1075px;

      padding: 70px 60px 60px;

      background-color: #ffffff;

      border-radius: 16px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.08);

      margin: 30px 20px;
    }

    /* 标题 */
    .title {
      margin: 0 0 58px;

      text-align: center;

      font-size: 62px;
      line-height: 1;

      font-weight: 700;

      color: #000000;
    }

    /* 表单 */
    .form-group {
      margin-bottom: 43px;
    }

    /* Label */
    .form-label {
      display: block;

      margin-bottom: 15px;

      font-size: 32px;
      line-height: 1.2;

      font-weight: 600;

      color: #555555;
    }

    /* 输入框 */
    .form-input {
      width: 100%;
      height: 80px;

      padding: 0 22px;

      border: 3px solid #3398dc;
      border-radius: 8px;

      outline: none;

      font-size: 28px;

      color: #333333;

      background-color: #ffffff;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .form-input::placeholder {
      color: #777777;
      opacity: 1;
    }

    .form-input:focus {
      border-color: #2186c7;

      box-shadow:
        0 0 0 2px rgba(51, 152, 220, 0.12);
    }

    /* 输入错误 */
    .form-input.error {
      border-color: #e74c3c;
    }

    .form-input.error:focus {
      border-color: #e74c3c;

      box-shadow:
        0 0 0 2px rgba(231, 76, 60, 0.12);
    }

    /* 错误信息 */
    .error-message {
      min-height: 24px;

      margin-top: 8px;

      font-size: 18px;

      color: #e74c3c;
    }

    /* 注册按钮 */
    .register-button {
      width: 100%;
      height: 86px;

      margin-top: 32px;

      border: none;
      border-radius: 8px;

      background-color: #369bdc;

      color: #ffffff;

      font-size: 32px;
      font-weight: 400;

      cursor: pointer;

      transition:
        background-color 0.2s ease,
        transform 0.1s ease;
    }

    .register-button:hover {
      background-color: #2c8dcc;
    }

    .register-button:active {
      transform: translateY(1px);
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      position: fixed;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      background-color: rgba(0, 0, 0, 0.35);

      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    /* 弹窗 */
    .success-modal {
      width: 420px;

      padding: 40px 35px 30px;

      background-color: #ffffff;

      border-radius: 12px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.2);

      text-align: center;

      animation: modalShow 0.2s ease;
    }

    @keyframes modalShow {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success-icon {
      width: 64px;
      height: 64px;

      margin: 0 auto 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background-color: #369bdc;

      color: #ffffff;

      font-size: 36px;
    }

    .success-message {
      margin: 0 0 30px;

      font-size: 24px;

      color: #333333;
    }

    .modal-button {
      width: 100%;
      height: 48px;

      border: none;
      border-radius: 6px;

      background-color: #369bdc;

      color: #ffffff;

      font-size: 18px;

      cursor: pointer;
    }

    .modal-button:hover {
      background-color: #2c8dcc;
    }

    /* 小屏适配 */
    @media (max-width: 700px) {
      body {
        align-items: flex-start;
      }

      .register-card {
        width: calc(100% - 30px);

        min-height: auto;

        margin: 20px 15px;

        padding: 45px 25px 40px;
      }

      .title {
        font-size: 48px;

        margin-bottom: 45px;
      }

      .form-label {
        font-size: 24px;
      }

      .form-input {
        height: 65px;

        font-size: 21px;
      }

      .register-button {
        height: 70px;

        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <!-- 注册卡片 -->
  <div class="register-card">

    <h1 class="title">Register</h1>

    <form id="registerForm" novalidate>

      <!-- Username -->
      <div class="form-group">
        <label
          class="form-label"
          for="username"
        >
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          class="form-input"
          placeholder="Enter username"
          autocomplete="username"
        />

        <div
          id="usernameError"
          class="error-message"
        ></div>
      </div>


      <!-- Email -->
      <div class="form-group">
        <label
          class="form-label"
          for="email"
        >
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="Enter email"
          autocomplete="email"
        />

        <div
          id="emailError"
          class="error-message"
        ></div>
      </div>


      <!-- Password -->
      <div class="form-group">
        <label
          class="form-label"
          for="password"
        >
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="Enter password"
          autocomplete="new-password"
        />

        <div
          id="passwordError"
          class="error-message"
        ></div>
      </div>


      <!-- Confirm Password -->
      <div class="form-group">
        <label
          class="form-label"
          for="confirmPassword"
        >
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          class="form-input"
          placeholder="Enter confirm password"
          autocomplete="new-password"
        />

        <div
          id="confirmPasswordError"
          class="error-message"
        ></div>
      </div>


      <!-- Register Button -->
      <button
        type="submit"
        class="register-button"
      >
        Register
      </button>

    </form>
  </div>


  <!-- 注册成功弹窗 -->
  <div
    id="successModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="successMessage"
  >

    <div class="success-modal">

      <div class="success-icon">
        ✓
      </div>

      <p
        id="successMessage"
        class="success-message"
      >
        Registeration sucessful
      </p>

      <button
        id="closeModal"
        class="modal-button"
        type="button"
      >
        OK
      </button>

    </div>

  </div>


  <script>
    // 获取元素
    const form = document.getElementById("registerForm");

    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const usernameError = document.getElementById("usernameError");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const confirmPasswordError =
      document.getElementById("confirmPasswordError");

    const successModal = document.getElementById("successModal");
    const closeModal = document.getElementById("closeModal");


    // 清除某一个输入框的错误
    function clearError(input, errorElement) {
      input.classList.remove("error");
      errorElement.textContent = "";
    }


    // 显示错误
    function showError(input, errorElement, message) {
      input.classList.add("error");
      errorElement.textContent = message;
    }


    // Username 校验
    function validateUsername() {
      const value = username.value.trim();

      clearError(username, usernameError);

      if (value === "") {
        showError(
          username,
          usernameError,
          "Please enter your username."
        );

        return false;
      }

      if (value.length < 3 || value.length > 20) {
        showError(
          username,
          usernameError,
          "Username must be 3–20 characters."
        );

        return false;
      }

      if (!/^[a-zA-Z0-9_]+$/.test(value)) {
        showError(
          username,
          usernameError,
          "Username can only contain letters, numbers and underscores."
        );

        return false;
      }

      return true;
    }


    // Email 校验
    function validateEmail() {
      const value = email.value.trim();

      clearError(email, emailError);

      if (value === "") {
        showError(
          email,
          emailError,
          "Please enter your email."
        );

        return false;
      }

      const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(value)) {
        showError(
          email,
          emailError,
          "Please enter a valid email address."
        );

        return false;
      }

      return true;
    }


    // Password 校验
    function validatePassword() {
      const value = password.value;

      clearError(password, passwordError);

      if (value === "") {
        showError(
          password,
          passwordError,
          "Please enter your password."
        );

        return false;
      }

      if (value.length < 8) {
        showError(
          password,
          passwordError,
          "Password must be at least 8 characters."
        );

        return false;
      }

      // 至少包含一个字母
      if (!/[A-Za-z]/.test(value)) {
        showError(
          password,
          passwordError,
          "Password must contain at least one letter."
        );

        return false;
      }

      // 至少包含一个数字
      if (!/[0-9]/.test(value)) {
        showError(
          password,
          passwordError,
          "Password must contain at least one number."
        );

        return false;
      }

      return true;
    }


    // 确认密码校验
    function validateConfirmPassword() {
      const value = confirmPassword.value;

      clearError(
        confirmPassword,
        confirmPasswordError
      );

      if (value === "") {
        showError(
          confirmPassword,
          confirmPasswordError,
          "Please confirm your password."
        );

        return false;
      }

      if (value !== password.value) {
        showError(
          confirmPassword,
          confirmPasswordError,
          "Passwords do not match."
        );

        return false;
      }

      return true;
    }


    // 表单提交
    form.addEventListener("submit", function (event) {
      // 阻止浏览器默认提交
      event.preventDefault();

      // 依次校验
      const isUsernameValid = validateUsername();
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      const isConfirmPasswordValid =
        validateConfirmPassword();

      // 所有校验通过
      if (
        isUsernameValid &&
        isEmailValid &&
        isPasswordValid &&
        isConfirmPasswordValid
      ) {

        // 显示注册成功弹窗
        successModal.classList.add("show");

      }
    });


    // 用户输入时实时校验
    username.addEventListener("blur", validateUsername);

    email.addEventListener("blur", validateEmail);

    password.addEventListener("blur", function () {
      validatePassword();

      // 如果确认密码已经填写，
      // 密码修改后重新检查两者是否一致
      if (confirmPassword.value !== "") {
        validateConfirmPassword();
      }
    });

    confirmPassword.addEventListener(
      "blur",
      validateConfirmPassword
    );


    // 关闭弹窗
    closeModal.addEventListener("click", function () {
      successModal.classList.remove("show");

      // 清空表单
      form.reset();

      // 清除错误状态
      clearError(username, usernameError);
      clearError(email, emailError);
      clearError(password, passwordError);
      clearError(
        confirmPassword,
        confirmPasswordError
      );

      // 回到 Username
      username.focus();
    });


    // 点击弹窗外部也可以关闭
    successModal.addEventListener(
      "click",
      function (event) {
        if (event.target === successModal) {
          successModal.classList.remove("show");
        }
      }
    );


    // ESC 关闭弹窗
    document.addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Escape" &&
          successModal.classList.contains("show")
        ) {
          successModal.classList.remove("show");
        }
      }
    );
  </script>

</body>
</html>
